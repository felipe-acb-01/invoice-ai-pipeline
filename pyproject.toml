[project]
name = "invoice-ai-pipeline"
version = "0.1.0"
description = "Read vendor invoices with Claude, validate them with plain rules, route them for approval."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "pydantic>=2.14",
    "reportlab>=5.1",
    "pypdfium2>=5.15",
    "pillow>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
